<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas SQLite</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; margin: 20px;}
        #tarefas-lista {list-style: none; padding: 0;}
        .tarefa-item{
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .concluida{ text-decoration: line-through; color: gray;}
        button {margin-left: 10px; cursor: pointer;}
        input[type="text"]{padding: 8px; width: 300px;}
    </style>
</head>
<body>
    <h1> Minhas Tarefas (SQLite)</h1>
    <div>
        <input type="text" id="nova-tarefa-titulo" placeholder="Nova tarefa...">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="tarefas-lista">
        
    </ul>

    <h2>Cadastro de Usuario</h2>
    <div>
        <input type="text" id="nome" placeholder="Nome do Usuario">
        <input type="text" id="email" placeholder="Email do Usuario">
        <input type="text" id="data" placeholder="Data de nascimento">
        <input type="text" id="senha" placeholder="Escolha uma senha">
        <button onclick="adicionarUsuario()">Cadastrar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
