<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas Full-Stack</title>
    <style>
        body{ font-family: Arial, sans-serif; margin: 20px;}
        #tarefas-lista{ list-style: none; padding: 0; }
        .tarefa-item{
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .concluida { text-decoration: line-through; color: gray;}
        button {margin-left: 10px; cursor: pointer;}
        input[type="text"] {padding: 8px; width: 300px;}
    </style>
</head>
<body>
    <h1>Minhas Tarefas</h1>

    <div>
        <input type="text" id="nova-tarefa-titulo" placeholder="Nova tarefa...">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="tarefas-lista">

    </ul>

    <script src="script.js"></script>
</body>
</html>
